<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input placeholder="Digite o login:" type="text" id="id_login">
    <input placeholder="Digite a senha:" type="text" id="id_senha">
    <input placeholder="Digite info pessoas" type="text" id="id_info">
    <button onclick="autenticar()">Autenticar</button>
    <div id="msg"></div>
</body>

</html>
<script>
    let contador = 4
    function autenticar() {
        let login = id_login.value;
        let senha = id_senha.value;
        let info = id_info.value;
        if (contador > 1) {
            if (login == "ana" && senha == "braga" && info == "1949" || info == "louro josé") {
                msg.innerHTML = `Usuário autenticado`
                contador = 3
            }
            else if (login != "ana" && senha != "braga" && info != "1949" || info != "louro josé") {
                contador = contador - 1
                msg.innerHTML = `Falha na autenticação <br> Você tem ${contador} tentativas`
            }
        }
        else {
            msg.innerHTML = ` Usuário BLOQUEADO! Procure seu gerente! `
        }
    }
</script>
