<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Clima</title>
</head>

<body>
    <h1>Avaliação do Clima</h1>

    Temperatura: <input type="text" id="ipt_temp"><br>
    Umidade do ar: <input type="text" id="ipt_umidade"><br>

    <button onclick="avaliar()">Avaliar clima</button>

    <div id="div_resposta"></div>

    <script>
        function avaliar() {
            let temp = Number(ipt_temp.value);
            let umidade = Number(ipt_umidade.value);

            if (umidade < 0 || umidade > 100) {
                alert("Valor de umidade inválido");
                div_resposta.innerHTML = "";
            } else {
                if (temp >= 22 && temp <= 23 && umidade < 60) {
                    div_resposta.innerHTML = "Clima agradável";
                } else {
                    div_resposta.innerHTML = "Clima desconfortável";
                }
            }
        }
    </script>
</body>

</html>
