<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 2b - Desafio</title>
</head>
<body>
    <h2>Exercício 2b (Desafio)</h2>
    <input id="ipt_texto" type="text" placeholder="Digite um texto">
    <button onclick="inverter()">Inverter Texto</button>
    
    <div id="div_resultado" style="margin-top: 20px;"></div>

    <script>
        function inverter() {
            let texto = document.getElementById("ipt_texto").value;
            let invertido = "";
            for (let i = texto.length - 1; i >= 0; i--) {
                invertido += texto[i];
            }
            document.getElementById("div_resultado").innerHTML = `<b>Texto invertido:</b> ${invertido}`;
        }
    </script>
</body>
</html>
