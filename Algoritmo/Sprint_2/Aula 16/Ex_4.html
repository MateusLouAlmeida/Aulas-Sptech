<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Poupança</title>
</head>
<body>
    <h2>Poupança</h2>
    Entre com o valor mensal de depósito: <input id="ipt_deposito" type="number"> <br>
    Entre com a quantidade de meses: <input id="ipt_meses" type="number"> <br>
    Entre com o percentual de juros: <input id="ipt_juros" type="number"> <br><br>
    Qual é o seu sonho: <input id="ipt_sonho"> <br>
    Qual o valor do seu sonho: <input id="ipt_valorSonho" type="number">
    <button onclick="projetar()">Projetar</button><br><br>
    <div id="div_msg"></div>

    <script>
        function projetar() {
            let deposito   = Number(ipt_deposito.value);
            let meses      = Number(ipt_meses.value);
            let juros      = Number(ipt_juros.value);
            let sonho      = ipt_sonho.value;
            let valorSonho = Number(ipt_valorSonho.value);

            if (deposito <= 0) {
                alert("Valor de depósito tem que ser maior que zero!");
                return;
            }
            if (meses <= 0 || meses % 1 !== 0) {
                alert("Meses tem que ser inteiro e maior que zero!");
                return;
            }
            if (juros <= 0 || juros >= 10) {
                alert("Juros tem que ser positivo, maior que zero e menor que 10!");
                return;
            }
            if (sonho.length < 3) {
                alert("Seu sonho tem que possuir ao menos 3 caracteres!");
                return;
            }
            if (valorSonho <= 0 || valorSonho <= deposito) {
                alert("Valor do sonho tem que ser positivo e maior que o depósito!");
                return;
            }

            div_msg.innerHTML = "";
            let valorFinal = 0;

            for (let mes = 1; mes <= meses; mes++) {
                let valorInicial = valorFinal;
                let valorJuros   = valorInicial * (juros / 100);
                valorFinal       = valorInicial + valorJuros + deposito;
                div_msg.innerHTML += "Mês = " + mes + " - Valor Inicial = R$ " + valorInicial.toFixed(2) + " - Juros = R$ " + valorJuros.toFixed(2) + " - Depósito = R$ " + deposito.toFixed(2) + " - Valor Final = R$ " + valorFinal.toFixed(2) + "<br>";
            }

            if (valorFinal >= valorSonho) {
                let sobra = valorFinal - valorSonho;
                div_msg.innerHTML += "<br>Parabéns você é um POUPADOR, além do seu sonho de " + sonho + " ainda sobrou R$ " + sobra.toFixed(2) + " para outras aquisições";
            } else {
                let falta = valorSonho - valorFinal;
                div_msg.innerHTML += "<br>Você precisa poupar um pouco mais. Para o sonho de " + sonho + " ainda falta R$ " + falta.toFixed(2);
            }
        }
    </script>
</body>
</html>
