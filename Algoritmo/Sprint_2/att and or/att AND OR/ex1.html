<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input placeholder="Nota para atendimento" type="text" id="id_nota">
    <button onclick=avaliar()>Avaliar atendimento</button>
    <div id="msg"></div>
</body>

</html>
<script>
    function avaliar() {
        let nota = Number(id_nota.value)
        if (nota < 0 || nota > 10) {
            msg.innerHTML = `Nota invalida`
        }
        else if (nota >= 0 && nota < 5) {
            msg.innerHTML = `Não aprovado`
        }
        else if (nota >= 5 && nota <= 6) {
            msg.innerHTML = `Neutro`
        }
        else if (nota > 6) {
            msg.innerHTML = `Aprovado`
        }


    }
</script>
