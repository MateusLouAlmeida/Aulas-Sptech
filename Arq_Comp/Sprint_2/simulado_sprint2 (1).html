<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado Sprint II — dat-acqu-ino</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e2a;
    --border: #252b3a;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --correct: #10b981;
    --wrong: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --code-bg: #1e2435;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #0d0f14 0%, #13161e 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: rgba(0,229,255,0.1);
    color: var(--accent);
    border: 1px solid rgba(0,229,255,0.3);
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  header h1 span { color: var(--accent); }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #progress-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }
  #progress-counter span { color: var(--accent); font-weight: 700; }

  /* Layout */
  .layout {
    display: flex;
    flex: 1;
    height: calc(100vh - 65px);
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sidebar-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0 4px 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .q-btn {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-align: left;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }
  .q-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(0,229,255,0.04); }
  .q-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.08); }
  .q-btn.answered { border-color: rgba(124,58,237,0.4); color: var(--text); background: rgba(124,58,237,0.06); }
  .q-btn.answered::after {
    content: '●';
    font-size: 8px;
    color: var(--accent2);
    margin-left: auto;
  }
  .q-btn.active.answered { border-color: var(--accent); }

  /* Main content */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 40px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    position: relative;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .q-number::before {
    content: '';
    display: block;
    width: 24px;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }

  .question-text {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 32px;
  }
  .question-text code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    background: var(--code-bg);
    color: #7dd3fc;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid rgba(125,211,252,0.15);
  }

  /* Answer options */
  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .answer-option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    width: 100%;
    text-align: left;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    position: relative;
  }
  .answer-option:hover {
    border-color: rgba(0,229,255,0.4);
    background: rgba(0,229,255,0.03);
  }
  .answer-option.selected {
    border-color: var(--accent2);
    background: rgba(124,58,237,0.1);
  }
  .answer-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    min-width: 22px;
    margin-top: 1px;
  }
  .answer-option.selected .answer-label { color: #a78bfa; }

  /* Result states */
  .answer-option.correct {
    border-color: var(--correct) !important;
    background: rgba(16,185,129,0.1) !important;
  }
  .answer-option.correct .answer-label { color: var(--correct); }
  .answer-option.wrong {
    border-color: var(--wrong) !important;
    background: rgba(239,68,68,0.1) !important;
  }
  .answer-option.wrong .answer-label { color: var(--wrong); }
  .answer-option.show-correct {
    border-color: rgba(16,185,129,0.5) !important;
    background: rgba(16,185,129,0.05) !important;
  }
  .answer-option.show-correct .answer-label { color: rgba(16,185,129,0.7); }

  /* Navigation bar */
  .nav-bar {
    max-width: 760px;
    width: 100%;
    margin: 24px auto 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .nav-btn {
    padding: 10px 24px;
    border-radius: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--text); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-btn.primary {
    border-color: var(--accent);
    background: rgba(0,229,255,0.08);
    color: var(--accent);
  }
  .nav-btn.primary:hover { background: rgba(0,229,255,0.15); }
  .nav-btn.finish {
    border-color: var(--accent2);
    background: rgba(124,58,237,0.12);
    color: #a78bfa;
    padding: 12px 32px;
    font-size: 14px;
  }
  .nav-btn.finish:hover { background: rgba(124,58,237,0.22); }

  /* Progress bar */
  .progress-bar-wrap {
    max-width: 760px;
    width: 100%;
    margin: 0 auto 20px;
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  /* Result screen */
  #result-screen {
    display: none;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    animation: fadeIn 0.4s ease;
  }
  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px;
    text-align: center;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .score-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
  }
  .score-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .score-value {
    font-size: 80px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .score-subtitle {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .score-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
  }
  .stat { text-align: center; }
  .stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
  }
  .stat-val.c { color: var(--correct); }
  .stat-val.w { color: var(--wrong); }
  .stat-val.s { color: var(--muted); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Wrong answers review */
  .review-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .review-title::before {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .review-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--wrong);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 12px;
  }
  .review-q {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
  }
  .review-q code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: var(--code-bg);
    color: #7dd3fc;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .review-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .review-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 5px;
  }
  .review-tag.your { background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
  .review-tag.correct { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
  .review-tag-label { font-size: 10px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }

  .restart-btn {
    display: block;
    margin: 32px auto 0;
    padding: 14px 40px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: rgba(0,229,255,0.08);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .restart-btn:hover { background: rgba(0,229,255,0.16); transform: translateY(-1px); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="header-tag">SPRINT II</div>
  <h1>Simulado <span>dat-acqu-ino</span></h1>
  <div class="header-right">
    <div id="progress-counter">Questão <span id="cur-num">1</span> de <span id="total-num">49</span></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Questões</div>
  </aside>

  <main class="main" id="main-content">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>

    <div id="quiz-area">
      <div class="question-card" id="question-card">
        <div class="q-number" id="q-num-label">Questão 01 / 49</div>
        <div class="question-text" id="question-text"></div>
        <div class="answers" id="answers-container"></div>
      </div>
      <div class="nav-bar">
        <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← Anterior</button>
        <button class="nav-btn primary" id="btn-next" onclick="navigate(1)">Próxima →</button>
        <button class="nav-btn finish" id="btn-finish" onclick="finishQuiz()" style="display:none;">Finalizar Tentativa ✓</button>
      </div>
    </div>

    <div id="result-screen"></div>
  </main>
</div>

const TOTAL = questions.length;
let currentIdx = 0;
let userAnswers = new Array(TOTAL).fill(-1);
let finished = false;

// Build sidebar buttons
const sidebar = document.getElementById('sidebar');
const titleDiv = sidebar.querySelector('.sidebar-title');
questions.forEach((q, i) => {
  const btn = document.createElement('button');
  btn.className = 'q-btn';
  btn.id = `qbtn-${i}`;
  btn.innerHTML = `<span>Q${String(q.num).padStart(2,'0')}</span>`;
  btn.onclick = () => goTo(i);
  sidebar.appendChild(btn);
});

function renderQuestion(idx) {
  const q = questions[idx];
  document.getElementById('cur-num').textContent = idx + 1;
  document.getElementById('total-num').textContent = TOTAL;
  document.getElementById('q-num-label').textContent = `Questão ${String(idx+1).padStart(2,'0')} / ${TOTAL}`;
  document.getElementById('question-text').innerHTML = q.question;

  const container = document.getElementById('answers-container');
  container.innerHTML = '';
  const labels = ['a', 'b', 'c', 'd', 'e'];
  q.answers.forEach((ans, ai) => {
    const btn = document.createElement('button');
    btn.className = 'answer-option';
    if (userAnswers[idx] === ai) btn.classList.add('selected');
    btn.innerHTML = `<span class="answer-label">${labels[ai]}.</span><span>${ans}</span>`;
    btn.onclick = () => selectAnswer(idx, ai);
    container.appendChild(btn);
  });

  // Update progress
  const answered = userAnswers.filter(a => a !== -1).length;
  document.getElementById('progress-bar').style.width = `${(answered/TOTAL)*100}%`;

  // Sidebar buttons
  document.querySelectorAll('.q-btn').forEach((b, i) => {
    b.classList.remove('active', 'answered');
    if (i === idx) b.classList.add('active');
    if (userAnswers[i] !== -1) b.classList.add('answered');
  });

  // Nav buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  const isLast = idx === TOTAL - 1;
  document.getElementById('btn-next').style.display = isLast ? 'none' : 'block';
  document.getElementById('btn-finish').style.display = isLast ? 'block' : 'none';
}

function selectAnswer(qIdx, ansIdx) {
  if (finished) return;
  userAnswers[qIdx] = ansIdx;
  renderQuestion(qIdx);
}

function navigate(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < TOTAL) {
    currentIdx = next;
    goTo(currentIdx);
  }
}

function goTo(idx) {
  currentIdx = idx;
  // re-animate card
  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = '';
  renderQuestion(idx);
}

function finishQuiz() {
  const unanswered = userAnswers.filter(a => a === -1).length;
  if (unanswered > 0) {
    const proceed = confirm(`Você tem ${unanswered} questão(ões) sem resposta. Deseja finalizar mesmo assim?`);
    if (!proceed) return;
  }
  finished = true;

  // Calculate score
  let correct = 0;
  questions.forEach((q, i) => {
    if (userAnswers[i] === q.correct) correct++;
  });
  const wrong = questions.filter((q, i) => userAnswers[i] !== -1 && userAnswers[i] !== q.correct).length;
  const skipped = userAnswers.filter(a => a === -1).length;
  const score = ((correct / TOTAL) * 10).toFixed(1);

  // Build result
  document.getElementById('quiz-area').style.display = 'none';
  const resultScreen = document.getElementById('result-screen');
  resultScreen.style.display = 'block';

  const labels = ['a', 'b', 'c', 'd', 'e'];
  const wrongItems = questions
    .map((q, i) => ({ q, i, ua: userAnswers[i] }))
    .filter(({ q, ua }) => ua !== -1 && ua !== q.correct);

  let wrongHTML = '';
  if (wrongItems.length > 0) {
    wrongHTML = `<div class="review-title">Questões Erradas (${wrongItems.length})</div>`;
    wrongItems.forEach(({ q, ua }) => {
      wrongHTML += `
        <div class="review-item">
          <div class="review-q">${q.question}</div>
          <div class="review-row">
            <div class="review-tag your">
              <span class="review-tag-label">SUA RESPOSTA</span>
              &nbsp;${labels[ua]}) ${q.answers[ua]}
            </div>
            <div class="review-tag correct">
              <span class="review-tag-label">RESPOSTA CORRETA</span>
              &nbsp;${labels[q.correct]}) ${q.answers[q.correct]}
            </div>
          </div>
        </div>`;
    });
  } else {
    wrongHTML = `<div class="review-title" style="color:var(--correct)">Parabéns! Gabarito perfeito! 🎉</div>`;
  }

  resultScreen.innerHTML = `
    <div class="score-card">
      <div class="score-label">Resultado Final — Sprint II</div>
      <div class="score-value">${score}</div>
      <div class="score-subtitle">${correct} de ${TOTAL} questões corretas</div>
      <div class="score-stats">
        <div class="stat"><div class="stat-val c">${correct}</div><div class="stat-label">Corretas</div></div>
        <div class="stat"><div class="stat-val w">${wrong}</div><div class="stat-label">Erradas</div></div>
        <div class="stat"><div class="stat-val s">${skipped}</div><div class="stat-label">Em Branco</div></div>
      </div>
    </div>
    ${wrongHTML}
    <button class="restart-btn" onclick="restartQuiz()">↺ Tentar Novamente</button>
  `;

  // Scroll to top
  document.querySelector('.main').scrollTop = 0;
}

function restartQuiz() {
  finished = false;
  currentIdx = 0;
  userAnswers = new Array(TOTAL).fill(-1);
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion(0);
}

// Init
renderQuestion(0);
</script>
