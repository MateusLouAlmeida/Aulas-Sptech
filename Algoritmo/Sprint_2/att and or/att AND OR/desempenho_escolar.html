<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desempenho Escolar</title>
</head>

<body>
    <h1>Análise de Desempenho Escolar</h1>

    Nota do aluno: <input type="text" id="ipt_nota"><br>
    Frequência do aluno: <input type="text" id="ipt_frequencia"><br>

    <button onclick="analisar()">Analisar aluno</button>

    <div id="div_resultado"></div>

    <script>
        function analisar() {
            let nota = Number(ipt_nota.value);
            let frequencia = Number(ipt_frequencia.value);

            div_resultado.innerHTML = "";

            if (nota < 0 || nota > 10) {
                alert("Onde já se viu nota <0 ou >10?!");
            } else if (frequencia < 0 || frequencia > 100) {
                alert("Onde já se viu frequência <0 ou >100?!");
            } else {
                if (nota < 6) {
                    div_resultado.innerHTML += "Aluno ficou abaixo da média<br>";
                } else if (nota <= 8) {
                    div_resultado.innerHTML += "Aluno ficou na média<br>";
                } else {
                    div_resultado.innerHTML += "Aluno acima da média<br>";
                }
                if (frequencia >= 75) {
                    div_resultado.innerHTML += "Aluno aprovado por frequência";
                } else {
                    div_resultado.innerHTML += "Aluno reprovado por frequência";
                }
            }
        }
    </script>
</body>

</html>
