<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex4</title>
</head>

<body>

    <button onclick="exibir()">S2 Pares</button>
    <div id="id"></div>
</body>

</html>
<script>
    function exibir() {
        let contador = 0
        while (contador <= 100) {
            if (contador % 2 == 0) {
                id.innerHTML += `${contador} <br>`
            }
            contador++
        }

    }
</script>
