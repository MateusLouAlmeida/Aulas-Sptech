  <center>
    <h1 style="color:white; text-shadow:1px 1px 4px black; padding-top:30px;">Hyper Machine</h1><br>
    <button onclick="mostrar('operacoes')">Operações</button>
    <button onclick="mostrar('conversao')">Conversão Unitária</button>
    <br><br>
    <div id="operacoes" style="display:none; color:white; text-shadow:1px 1px 4px black;">
      <h3>Faça sua operação:</h3><br>
      <input type="text" id="id_n1" size="8" placeholder="Número 1">
      <select id="id_baseN1">
        <option value="2">Binário</option>
        <option value="8">Octal</option>
        <option value="10" selected>Decimal</option>
        <option value="16">Hexadecimal</option>
      </select>
      <select id="id_operacao">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input type="text" id="id_n2" size="8" placeholder="Número 2">
      <select id="id_baseN2">
        <option value="2">Binário</option>
        <option value="8">Octal</option>
        <option value="10" selected>Decimal</option>
        <option value="16">Hexadecimal</option>
      </select>
      <br><br>
      Resultado na base:
      <select id="id_base_res">
        <option value="10">Decimal</option>
        <option value="2">Binário</option>
        <option value="8">Octal</option>
        <option value="16">Hexadecimal</option>
      </select>
      <br><br>
      <button onclick="calcular()">Calcular</button>
      <br><br>
      <div id="id_mensagem"></div>
    </div>
    <div id="conversao" style="display:none; color:white; text-shadow:1px 1px 4px black;">
      <h3>Converta seu número:</h3><br>
      <input type="text" id="id_num" placeholder="Digite o número">
      <select id="id_base">
        <option value="2">Binário</option>
        <option value="8">Octal</option>
        <option value="10" selected>Decimal</option>
        <option value="16">Hexadecimal</option>
      </select>
      <br><br>
      Converter para:
      <select id="id_base_pref">
        <option value="0">Todos</option>
        <option value="10">Decimal</option>
        <option value="2">Binário</option>
        <option value="8">Octal</option>
        <option value="16">Hexadecimal</option>
      </select>
      <br><br>
      <button onclick="converter()">Converter</button>
      <br><br>
      <div id="resultado"></div>
    </div>
  </center>
  <script>
    function mostrar(id) {
      document.getElementById('operacoes').style.display = 'none';
      document.getElementById('conversao').style.display = 'none';
      document.getElementById(id).style.display = 'block';
    }
    function calcular() {
      let v1 = parseInt(id_n1.value, id_baseN1.value);
      let v2 = parseInt(id_n2.value, id_baseN2.value);
      let op = id_operacao.value;
      let base = id_base_res.value;
      if (isNaN(v1) || isNaN(v2)) { id_mensagem.innerHTML = 'Valor inválido!'; return; }
      let r;
      if (op == '+') r = v1 + v2;
      else if (op == '-') r = v1 - v2;
      else if (op == '*') r = v1 * v2;
      else { if (v2 == 0) { id_mensagem.innerHTML = 'Divisão por zero!'; return; } r = v1 / v2; }
      id_mensagem.innerHTML = '<b>Resultado: </b>' + (Number.isInteger(r) ? r.toString(base).toUpperCase() : r.toFixed(4));
    }
    function converter() {
      let dec = parseInt(id_num.value, id_base.value);
      let pref = id_base_pref.value;
      if (isNaN(dec)) { resultado.innerHTML = 'Valor inválido!'; return; }
      if (pref == 0) {
        resultado.innerHTML =
          '<b>Binário:</b> ' + dec.toString(2).toUpperCase() + '<br>' +
          '<b>Octal:</b> ' + dec.toString(8).toUpperCase() + '<br>' +
          '<b>Decimal:</b> ' + dec.toString(10) + '<br>' +
          '<b>Hexadecimal:</b> ' + dec.toString(16).toUpperCase();
      } else {
        resultado.innerHTML = '<b>Resultado: </b>' + dec.toString(Number(pref)).toUpperCase();
      }
    }
  </script>
